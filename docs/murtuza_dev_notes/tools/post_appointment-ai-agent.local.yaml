# =============================================================================
# ai-agent.local.yaml  —  Smart Doctor Clinic operator overrides
# This file is git-ignored. Edit freely; it merges on top of ai-agent.yaml.
# =============================================================================

audiosocket:
  host: 192.168.0.170    # AI engine IP — Asterisk dials here for AudioSocket
  port: 8090

# -----------------------------------------------------------------------------
# CONTEXT
# -----------------------------------------------------------------------------
contexts:
  default:
    provider: deepgram
    greeting_found: "Welcome back {patient_name}! How can I help you today?"
    greeting_not_found: "Hello! Welcome to Smart Doctor Clinic. I am Ava, your appointment assistant. How can I help you today?"

    prompt: |
      You are Ava, an AI appointment assistant for Smart Doctor Clinic. You help patients
      book doctor appointments over the phone. Be warm, professional, and concise.

      =========================================================
      PATIENT CONTEXT (injected before call):
      - lookup_success: {lookup_success}
      - patient_name:   {patient_name}
      - patient_id:     {patient_id}
      - patient_phone:  {patient_phone}
      - patient_status: {patient_status}
      =========================================================

      =========================================================
      STRICT CONVERSATION STATE MACHINE
      You move through these states ONE WAY. You NEVER go back to a previous state.

      STATE 1 - PATIENT IDENTIFICATION
      STATE 2 - DOCTOR SELECTION
      STATE 3 - DATE SELECTION
      STATE 4 - SERIAL CONFIRMATION
      STATE 5 - BOOKING CONFIRMED
      STATE 6 - CALL END
      =========================================================

      =========================================================
      STATE 1 - PATIENT IDENTIFICATION
      =========================================================
      - IF {lookup_success} is "true" AND {patient_name} is not empty:
        Patient is already identified. patient_id = {patient_id}.
        Move IMMEDIATELY to STATE 2. Do NOT ask for their name.

      - IF {lookup_success} is "false" OR {patient_name} is empty:
        Ask: "Could I have your full name please?"
        Call register_patient with their spoken name and phone = {caller_number}.
        On success: store reg_patient_id as patient_id.
        Say: "I have registered you." then move to STATE 2.

      =========================================================
      STATE 2 - DOCTOR SELECTION
      =========================================================
      ENTRY ACTION: Call fetch_doctor_list ONCE to get available doctors.

      When reading the doctor list aloud, always use natural spoken language.
      CORRECT:   "We have Dr. Hina Farooqi, General Physician, and Dr. Zaid Ansari,
                  Cardiologist. Which doctor would you like to see?"
      INCORRECT: "1. Dr. Hina Farooqi - General Physician 2. Dr. Zaid Ansari"

      Rules for reading the list:
      - Do NOT say numbers like 1, 2, 3 before doctor names
      - Do NOT say dashes or dots between name and specialty
      - Use the word "and" to join multiple doctors
      - Say name then specialty naturally: "Dr. X, Specialty"

      Ask: "Which doctor would you like to see?"
      When patient picks a doctor, store doctor_id and doctor_name internally.

      CRITICAL RULE: Once the patient has chosen a doctor (doctor_id is known),
      you are in STATE 3 or beyond. NEVER call fetch_doctor_list again for
      the rest of this call, even if the patient says "yes" or "okay".

      =========================================================
      STATE 3 - DATE SELECTION
      =========================================================
      ENTRY: You arrive here right after the patient picks a doctor.
      Ask: "What date would you like to book? For example, tomorrow or a specific date?"
      Convert their answer to a concrete date (YYYY-MM-DD). Today is {today}.
      Confirm back: "So that is [Day], [Month] [Date] [Year] with [Doctor Name]. Is that correct?"
      Wait for explicit Yes or No.
        - No  -- Ask for the date again. Stay in STATE 3.
        - Yes -- Call get_next_serial with doctor_id and appointment_date IMMEDIATELY.
                 Store next_serial and estimated_time from the response.
                 Move to STATE 4.

      CRITICAL RULE: A Yes confirming the date means call get_next_serial right away.
      Do NOT call fetch_doctor_list. Do NOT ask about doctors again.

      =========================================================
      STATE 4 - SERIAL CONFIRMATION
      =========================================================
      ENTRY: You arrive here after get_next_serial returns successfully.
      Say: "Your serial number will be [next_serial], with an estimated appointment
            time of [estimated_time] on [Date] with [Doctor Name]. Shall I confirm your booking?"

      When reading estimated_time, say only hours and minutes. Say "9:00 AM" not "09:00:00".

      Wait for explicit Yes or No.
        - No  -- Ask: "Would you like to try a different date?" then go back to STATE 3.
        - Yes -- Call book_appointment with patient_id, doctor_id, and appointment_date.
                 Move to STATE 5.

      CRITICAL RULE: Yes here means call book_appointment ONCE immediately.
      Do NOT call get_next_serial again. Do NOT call fetch_doctor_list.

      =========================================================
      STATE 5 - BOOKING CONFIRMED
      =========================================================
      ENTRY: You arrive here after book_appointment returns successfully.
      Say: "Your appointment is confirmed. Confirmation code [confirmation_code].
            [Day] [Date] at [start_time], serial number [serial_number], with [Doctor Name]."

      When reading times, say only hours and minutes. Say "9:00 AM" not "09:00:00".
      Do NOT spell out the confirmation code letter by letter. Read it as a word group.

      Ask: "Is there anything else I can help you with?"
        - If yes -- help them, but do NOT re-book or re-call any booking tools.
        - If no  -- move to STATE 6.

      If book_appointment fails:
        Say: "I am sorry, I was not able to confirm your booking right now."
        Ask: "Would you like to try a different date?" then go back to STATE 3.

      =========================================================
      STATE 6 - CALL END
      =========================================================
      When patient says they are done or goodbye, say a warm farewell.
      Then IMMEDIATELY use the hangup_call tool to end the call.
      NEVER mention tool names to the caller.

      =========================================================
      GENERAL RULES
      =========================================================
      - Keep all responses short, 1 to 2 sentences unless listing options.
      - Do NOT read punctuation, brackets, or technical IDs aloud.
      - Do NOT read time seconds. Say "9:00 AM" not "09:00:00".
      - If a tool call fails, apologize briefly and offer to try again.
      - Never reveal internal variable names or tool names to the caller.
      - Today's date reference: use {today} for any relative date calculations.

      ANTI-HALLUCINATION RULES (CRITICAL):
      - You have ZERO knowledge of this clinic's doctors, serials, or appointments.
      - NEVER invent, guess, or recall any doctor names, IDs, or specialties.
      - The ONLY doctors you may mention are those returned by fetch_doctor_list.
      - The ONLY serial number and time you may mention are those returned by get_next_serial.
      - If get_next_serial fails, apologize and ask if they want a different date.

    in_call_http_tools:
      - register_patient
      - fetch_doctor_list
      - get_next_serial
      - book_appointment

    # Murtuza change ──────────────────────────────────────────────────────────
    # REASON: hangup_call is a built-in telephony tool. It must be listed here
    # under 'tools' (not in_call_http_tools) so the engine adds it to the
    # Deepgram allowed-tools list and Deepgram's LLM can call it.
    # Previously tools: null meant hangup_call was never sent to Deepgram,
    # so the AI said "Goodbye" but the call never actually ended.
    # ── end Murtuza change ────────────────────────────────────────────────────
    tools:
      - hangup_call

    pre_call_tools:
      - name_look_up

    post_call_tools:
      - smart_doctor_call_log

# -----------------------------------------------------------------------------
# GLOBAL PROVIDER DEFAULTS
# -----------------------------------------------------------------------------
default_provider: deepgram

pipelines:
  local_hybrid:
    tools: null

providers:
  deepgram:
    enabled: true
    greeting: Hello

# -----------------------------------------------------------------------------
# IN-CALL TOOLS  (AI decides when to call these during conversation)
# -----------------------------------------------------------------------------
in_call_tools:

  register_patient:
    kind: in_call_http_lookup
    phase: in_call
    enabled: true
    is_global: false
    timeout_ms: 5000
    url: http://168.144.27.225/api/v1/tools/patients/register
    method: POST
    headers:
      Content-Type: application/json
      X-Tenant-ID: '1'
      X-API-Key: dev-api-key-replace-in-production
    query_params: {}
    success_status_codes: [200, 201]
    output_variables:
      reg_success: success
      reg_patient_id: data.id
      reg_patient_name: data.fullName
      reg_patient_code: data.patientCode
    description: >-
      Registers a new patient in the system. Call this ONLY when name_look_up
      returned not found and the caller has provided their full name.
      Always pass the caller phone number as {caller_number}.
    parameters:
      - name: fullName
        type: string
        description: Full name of the patient as spoken by the caller
        required: true
      - name: phone
        type: string
        description: Caller phone number - always pass {caller_number}
        required: true
    return_raw_json: false
    error_message: I am sorry, I could not register you right now. Please try again.
    body_template: |
      {
        "fullName": "{fullName}",
        "phone": "{phone}",
        "consentDataProcessing": true,
        "consentAiInteraction": true,
        "consentCommunication": true
      }

  fetch_doctor_list:
    kind: in_call_http_lookup
    phase: in_call
    enabled: true
    is_global: false
    timeout_ms: 5000
    url: http://168.144.27.225/api/v1/tools/doctors
    method: GET
    headers:
      Content-Type: application/json
      X-Tenant-ID: '1'
      X-API-Key: dev-api-key-replace-in-production
    query_params: {}
    output_variables:
      doctors_list: data.content
      doctors_count: data.totalElements
    description: >-
      Fetches the list of available doctors with their specialties from the clinic system.
      Call this ONCE at the start of STATE 2 (doctor selection) to present options
      to the patient. Do NOT call this again after a doctor has already been selected.
      Returns doctors_list (array with id, fullName, specialty) and doctors_count.
    parameters: []
    return_raw_json: false
    error_message: I am sorry, I could not retrieve the doctor list right now.

  get_next_serial:
    kind: in_call_http_lookup
    phase: in_call
    enabled: true
    is_global: false
    timeout_ms: 5000
    url: http://168.144.27.225/api/v1/appointments/next-serial
    method: GET
    headers:
      Content-Type: application/json
      X-Tenant-ID: '1'
      X-API-Key: dev-api-key-replace-in-production
    query_params:
      doctorId: '{doctor_id}'
      date: '{appointment_date}'
    output_variables:
      next_serial: data.nextSerial
      estimated_time: data.estimatedTime
    description: >-
      Fetches the next available serial number and estimated appointment time for a
      specific doctor on a specific date. Call this in STATE 3 immediately after the
      patient confirms the date with Yes. Requires doctor_id and appointment_date.
      Returns next_serial (integer) and estimated_time (HH:MM:SS, read as HH:MM to patient).
    parameters:
      - name: doctor_id
        type: string
        description: The ID of the doctor chosen by the patient
        required: true
      - name: appointment_date
        type: string
        description: The appointment date in YYYY-MM-DD format
        required: true
    return_raw_json: false
    error_message: I am sorry, I could not check availability for that date. Would you like to try a different date?

  # Murtuza change ──────────────────────────────────────────────────────────
  # REASON: Real booking implementation replacing the previous stub that only
  # told the patient "our team will contact you".
  # Called in STATE 4 after explicit Yes to serial confirmation.
  # patientId and doctorId are integers (not quoted) in the JSON body.
  # appointmentType and source are hardcoded for voice channel bookings.
  # success_status_codes includes 201 because the API returns HTTP 201 Created.
  # ── end Murtuza change ────────────────────────────────────────────────────
  book_appointment:
    kind: in_call_http_lookup
    phase: in_call
    enabled: true
    is_global: false
    timeout_ms: 8000
    url: http://168.144.27.225/api/v1/appointments
    method: POST
    headers:
      Content-Type: application/json
      X-Tenant-ID: '1'
      X-API-Key: dev-api-key-replace-in-production
    query_params: {}
    success_status_codes: [200, 201]
    output_variables:
      appointment_id: data.id
      confirmation_code: data.confirmationCode
      start_time: data.startTime
      serial_number: data.serialNumber
      appointment_status: data.status
    description: >-
      Books a doctor appointment for the patient. Call this in STATE 4 ONLY after
      the patient has explicitly confirmed the serial number and estimated time.
      Requires patient_id, doctor_id, and appointment_date.
      appointmentType is always CONSULTATION and source is always MANUAL.
    parameters:
      - name: patient_id
        type: string
        description: The patient ID from name_look_up (patient_id) or register_patient (reg_patient_id)
        required: true
      - name: doctor_id
        type: string
        description: The doctor ID chosen by the patient in STATE 2
        required: true
      - name: appointment_date
        type: string
        description: The confirmed appointment date in YYYY-MM-DD format
        required: true
    return_raw_json: false
    error_message: I am sorry, I was not able to confirm your booking. Would you like to try a different date?
    body_template: |
      {
        "patientId": {patient_id},
        "doctorId": {doctor_id},
        "appointmentDate": "{appointment_date}",
        "appointmentType": "CONSULTATION",
        "source": "MANUAL"
      }

# -----------------------------------------------------------------------------
# PRE-CALL TOOLS  (run automatically before greeting, output injected into prompt)
# -----------------------------------------------------------------------------
tools:

  name_look_up:
    kind: generic_http_lookup
    phase: pre_call
    enabled: true
    is_global: false
    timeout_ms: 2000
    url: http://168.144.27.225/api/v1/tools/patients/lookup
    method: POST
    headers:
      Content-Type: application/json
      X-Tenant-ID: '1'
      X-API-Key: dev-api-key-replace-in-production
    query_params: {}
    output_variables:
      lookup_success: success
      patient_name: data.fullName
      patient_id: data.id
      patient_phone: data.phone
      patient_status: data.status
    body_template: |
      {"query": {caller_number}}

  # Murtuza change ──────────────────────────────────────────────────────────
  # REASON: Post-call webhook to log every call to the Smart Doctor clinic
  # call-log API (/api/v1/tools/call-logs).
  # Fires automatically after the call ends (phase: post_call, fire-and-forget).
  #
  # Variables available in payload_template:
  #   Built-in : {call_id}, {caller_number}, {call_outcome}, {call_duration},
  #              {call_start_time}, {call_end_time}, {transcript_json}
  #   Pre-call : {patient_id}, {patient_name}, {patient_phone} - flattened
  #              from pre_call_results by the Murtuza change in generic_webhook.py
  #   Hardcoded: appointmentId=0  (in-call tool results not available post-call)
  #              aiConfidenceAvg=0 (not tracked by engine)
  #              humanTransferred=false (derive from call_outcome on backend)
  #              transferReason=""  (not tracked by engine)
  #
  # NOTE for backend: transcript uses role/content format.
  #   Map: role -> speaker,  content -> message  on ingestion.
  # ── end Murtuza change ────────────────────────────────────────────────────
  smart_doctor_call_log:
    kind: generic_webhook
    phase: post_call
    enabled: true
    is_global: false
    timeout_ms: 8000
    url: http://168.144.27.225/api/v1/tools/call-logs
    method: POST
    headers:
      Content-Type: application/json
      X-Tenant-ID: '1'
      X-API-Key: dev-api-key-replace-in-production
    payload_template: |
      {
        "sessionId":        "{call_id}",
        "callerPhone":      "{caller_number}",
        "patientId":        "{patient_id}",
        "appointmentId":    0,
        "status":           "{call_outcome}",
        "startedAt":        "{call_start_time}",
        "endedAt":          "{call_end_time}",
        "durationSeconds":  {call_duration},
        "aiConfidenceAvg":  0,
        "humanTransferred": false,
        "transferReason":   "",
        "outcome":          "{call_outcome}",
        "transcript":       {transcript_json}
      }
