[from-ai-agent]
exten => s,1,NoOp(AI Agent Call)
 same => n,Set(AI_CONTEXT=default)
 same => n,Set(AI_PROVIDER=deepgram)
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

[from-outbound-reminder]
exten => s,1,NoOp(AI Agent Call)
 same => n,Set(AI_CONTEXT=outbound_reminder)
 same => n,Set(AI_PROVIDER=deepgram)
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

[from-ai-outbound]
exten => _X.,1,NoOp(AI Outbound Reminder with AMD - raw exten=${EXTEN})
 same => n,Set(DIAL_NUMBER=${CUT(EXTEN,_,1)})
 same => n,Set(APPOINTMENT_ID=${CUT(EXTEN,_,2)})
 same => n,Set(PATIENT_ID=${CUT(EXTEN,_,3)})
 same => n,NoOp(DEBUG: phone=${DIAL_NUMBER} appt=${APPOINTMENT_ID} patient=${PATIENT_ID})
 same => n,Dial(PJSIP/${DIAL_NUMBER},20,U(sub-amd-check,s,1))
 same => n,NoOp(DIALSTATUS=${DIALSTATUS})
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Set(CALL_RESULT=${IF($["${DIALSTATUS}"="BUSY"]?busy:no_answer)})
 same => n,Set(IGNORED=${SHELL(curl -s -X POST http://168.144.27.225/api/v1/tools/call-result -H 'Content-Type: application/json' -H 'X-Tenant-ID: 1' -H 'X-API-Key: dev-api-key-replace-in-production' --data '{"appointmentId":"${APPOINTMENT_ID}","result":"${CALL_RESULT}","patientId":"${PATIENT_ID}"}' --max-time 5)})
 same => n,NoOp(HOS webhook result: ${IGNORED})
 same => n(done),Hangup()

exten => h,1,NoOp(Hangup handler: DIALSTATUS=${DIALSTATUS} CALL_RESULT=${CALL_RESULT} APPT=${APPOINTMENT_ID})
 same => n,GotoIf($["${CALL_RESULT}" != ""]?done)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,GotoIf($["${APPOINTMENT_ID}" = ""]?done)
 same => n,Set(CALL_RESULT=no_answer)
 same => n,Set(IGNORED=${SHELL(curl -s -X POST http://168.144.27.225/api/v1/tools/call-result -H 'Content-Type: application/json' -H 'X-Tenant-ID: 1' -H 'X-API-Key: dev-api-key-replace-in-production' --data '{"appointmentId":"${APPOINTMENT_ID}","result":"${CALL_RESULT}","patientId":"${PATIENT_ID}"}' --max-time 5)})
 same => n,NoOp(HOS hangup webhook: ${IGNORED})
 same => n(done),NoOp(Hangup handler done)

[sub-amd-check]
exten => s,1,NoOp(AMD detection running)
 same => n,AMD(2000,2000,1000,5000)
 same => n,NoOp(AMD: status=${AMDSTATUS} cause=${AMDCAUSE})
 same => n,GotoIf($["${AMDCAUSE:0:7}" = "TOOLONG"]?human)
 same => n,GotoIf($["${AMDCAUSE:0:14}" = "INITIALSILENCE"]?human)
 same => n,GotoIf($["${AMDSTATUS}" = "HUMAN"]?human)
 same => n,Hangup()
 same => n(human),Return()

[from-internal-custom]
exten => 7000,1,NoOp(Intercept ext 7000 -> AI Agent)
 same => n,Set(AI_CONTEXT=ivr_main)
 same => n,Set(AI_PROVIDER=deepgram)
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

exten => 7001,1,NoOp(Intercept ext 7001 -> AI Agent)
 same => n,Set(AI_CONTEXT=ivr_appointments)
 same => n,Set(AI_PROVIDER=deepgram)
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

exten => 7002,1,NoOp(Intercept ext 7002 -> AI Agent)
 same => n,Goto(from-ai-agent,s,1)

exten => 7003,1,NoOp(Intercept ext 7003 -> AI Agent)
 same => n,Set(AI_CONTEXT=ivr_reschedule)
 same => n,Set(AI_PROVIDER=deepgram)
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

exten => 7004,1,NoOp(Intercept ext 7004 -> AI Agent)
 same => n,Set(AI_CONTEXT=ivr_cancel)
 same => n,Set(AI_PROVIDER=deepgram)
 same => n,Stasis(asterisk-ai-voice-agent)
 same => n,Hangup()

exten => 8000,1,NoOp(Intercept ext 8000 -> AI Agent)
 same => n,Goto(from-outbound-reminder,s,1)

[aava-outbound-amd]
exten => s,1,NoOp(AAVA Outbound AMD hop)
 same => n,NoOp(Attempt=${AAVA_ATTEMPT_ID} Campaign=${AAVA_CAMPAIGN_ID} Lead=${AAVA_LEAD_ID})
 same => n,ExecIf($["${AAVA_AMD_OPTS}" = ""]?Set(AAVA_AMD_OPTS=2000,2000,1000,5000))
 same => n,AMD(${AAVA_AMD_OPTS})
 same => n,NoOp(AMDSTATUS=${AMDSTATUS} AMDCAUSE=${AMDCAUSE})
 same => n,GotoIf($["${AMDCAUSE:0:7}" = "TOOLONG"]?human)
 same => n,GotoIf($["${AMDCAUSE:0:14}" = "INITIALSILENCE"]?human)
 same => n,GotoIf($["${AMDSTATUS}" = "HUMAN"]?human)
 same => n,GotoIf($["${AMDSTATUS}" = "NOTSURE"]?machine)
 same => n(machine),GotoIf($["${AAVA_VM_ENABLED}" = "1"]?vm:machine_done)
 same => n(vm),WaitForSilence(1500,3,10)
 same => n(machine_done),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},MACHINE,${AMDCAUSE},,)
 same => n,Hangup()
 same => n(human),GotoIf($["${AAVA_CONSENT_ENABLED}" = "1"]?consent:human_done)
 same => n(consent),Set(TIMEOUT(response)=${IF($["${AAVA_CONSENT_TIMEOUT}"=""]?5:${AAVA_CONSENT_TIMEOUT})})
 same => n,NoOp(AAVA CONSENT enabled=${AAVA_CONSENT_ENABLED} timeout=${AAVA_CONSENT_TIMEOUT} playback=${AAVA_CONSENT_PLAYBACK})
 same => n,Read(AAVA_CONSENT_DTMF,${AAVA_CONSENT_PLAYBACK},1)
 same => n,NoOp(AAVA CONSENT dtmf=${AAVA_CONSENT_DTMF})
 same => n,GotoIf($["${AAVA_CONSENT_DTMF}" = "1"]?human_ok)
 same => n,GotoIf($["${AAVA_CONSENT_DTMF}" = "2"]?human_denied)
 same => n(human_timeout),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},HUMAN,${AMDCAUSE},,timeout)
 same => n,Hangup()
 same => n(human_denied),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},HUMAN,${AMDCAUSE},2,denied)
 same => n,Hangup()
 same => n(human_ok),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},HUMAN,${AMDCAUSE},1,accepted)
 same => n,Hangup()
 same => n(human_done),Stasis(asterisk-ai-voice-agent,outbound_amd,${AAVA_ATTEMPT_ID},HUMAN,${AMDCAUSE},,skipped)
 same => n,Hangup()