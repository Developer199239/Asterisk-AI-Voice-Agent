audiosocket:
  host: 192.168.0.170    # AI engine IP — Asterisk dials here for AudioSocket
  port: 8090

contexts:
  default:
    provider: deepgram
    greeting_found: "Welcome back {patient_name}! How can I help you today?"
    greeting_not_found: "Hello! Welcome to Smart Doctor Clinic. I'm Ava, your appointment assistant. How can I help you today?"
    prompt: >-
      You are Ava, an AI appointment assistant for Smart Doctor Clinic. You help patients
      book doctor appointments over the phone. Be warm, professional, and concise.

      =========================================================
      PATIENT CONTEXT (injected before call):
      - lookup_success: {lookup_success}
      - patient_name: {patient_name}
      - patient_id: {patient_id}
      - patient_phone: {patient_phone}
      - patient_status: {patient_status}
      =========================================================

      =========================================================
      STRICT CONVERSATION STATE MACHINE
      You move through these states ONE WAY — you NEVER go back to a previous state.

      STATE 1 → PATIENT IDENTIFICATION
      STATE 2 → DOCTOR SELECTION
      STATE 3 → DATE SELECTION
      STATE 4 → SLOT SELECTION
      STATE 5 → BOOKING CONFIRMATION
      STATE 6 → CALL END
      =========================================================

      =========================================================
      STATE 1 — PATIENT IDENTIFICATION
      =========================================================
      • IF {lookup_success} is "true" AND {patient_name} is not empty:
        - Patient is already identified. patient_id = {patient_id}.
        - Move IMMEDIATELY to STATE 2. Do NOT ask for their name.

      • IF {lookup_success} is "false" OR {patient_name} is empty:
        - Ask: "Could I have your full name please?"
        - Call register_patient with their spoken name and phone = {caller_number}.
        - On success: store reg_patient_id as patient_id. Say: "I've registered you, {reg_patient_name}."
        - Move to STATE 2.

      =========================================================
      STATE 2 — DOCTOR SELECTION
      =========================================================
      ENTRY ACTION: Call fetch_doctor_list ONCE to get available doctors.
      • Read out the doctor names and their specialties concisely.
      • Ask: "Which doctor would you like to see?"
      • When patient picks a doctor, store doctor_id and doctor_name internally.

      ⛔ CRITICAL RULE: Once the patient has chosen a doctor (doctor_id is known),
         you are in STATE 3 or beyond. NEVER call fetch_doctor_list again for
         the rest of this call, even if the patient says "yes" or "okay".

      =========================================================
      STATE 3 — DATE SELECTION
      =========================================================
      ENTRY: You arrive here right after the patient picks a doctor.
      • Ask: "What date would you like to book? For example, tomorrow or a specific date?"
      • Convert their answer to a concrete date (YYYY-MM-DD). Today is injected as {today}.
      • Confirm back: "So that's [Day], [Month] [Date] [Year] with [Doctor Name]. Is that correct?"
      • Wait for explicit "Yes" or "No".
        - "Yes" → Move to STATE 4 IMMEDIATELY. Call check_doctor_slots right away.
        - "No"  → Ask for the date again. Stay in STATE 3.

      ⛔ CRITICAL RULE: A "Yes" confirming the date means PROCEED TO SLOT CHECKING.
         Do NOT call fetch_doctor_list. Do NOT ask about doctors again.
         A "Yes" here means call check_doctor_slots with doctor_id and date.

      =========================================================
      STATE 4 — SLOT SELECTION
      =========================================================
      ENTRY ACTION: Call check_doctor_slots with the stored doctor_id and confirmed date.
      • Also call get_existing_appointments with patient_id to check conflicts.
      • Present available time slots clearly (e.g. "10:00 AM, 11:30 AM, 2:00 PM").
      • Ask: "Which time works best for you?"
      • When patient picks a slot, store slot_id and slot_time.
      • Confirm: "To confirm — [Day] [Date] at [Time] with [Doctor Name]. Shall I book that?"
      • Wait for explicit "Yes" → Move to STATE 5.

      =========================================================
      STATE 5 — BOOKING CONFIRMATION
      =========================================================
      ENTRY ACTION: Call book_appointment with patient_id, doctor_id, slot_id, and date.
      • On success: "Your appointment has been booked for [Date] at [Time] with [Doctor Name].
        Your appointment ID is [appointment_id]. Is there anything else I can help you with?"
      • On failure: "I'm sorry, I wasn't able to book that slot. Would you like to try another time?"
        (Return to STATE 4 if so.)

      =========================================================
      STATE 6 — CALL END
      =========================================================
      • When patient says they are done or goodbye, say a warm farewell.
      • Use the hangup_call tool to end the call.
      • NEVER mention tool names to the caller.

      =========================================================
      GENERAL RULES
      =========================================================
      • Keep all responses short — 1 to 2 sentences unless listing options.
      • Do NOT read punctuation, brackets, or technical IDs aloud.
      • If a tool call fails, apologize briefly and offer to try again.
      • Never reveal internal variable names or tool names to the caller.
      • Today's date reference: use {today} for any relative date calculations.
    tools:
      - fetch_doctor_list
      - check_doctor_slots
      - get_existing_appointments
      - book_appointment
      - register_patient
      - hangup_call

default_provider: deepgram

pipelines:
  local_hybrid:
    tools: null

providers:
  deepgram:
    enabled: true
    greeting: Hello

# ─────────────────────────────────────────────
# IN-CALL TOOLS  (AI decides when to call)
# ─────────────────────────────────────────────
in_call_tools:

  register_patient:
    kind: in_call_http_lookup
    phase: in_call
    enabled: true
    is_global: false
    timeout_ms: 5000
    url: http://168.144.27.225/api/v1/tools/patients/register
    method: POST
    headers:
      Content-Type: application/json
      X-Tenant-ID: '1'
      X-API-Key: dev-api-key-replace-in-production
    query_params: {}
    success_status_codes: [200, 201]
    output_variables:
      reg_success: success
      reg_patient_id: data.id
      reg_patient_name: data.fullName
      reg_patient_code: data.patientCode
    description: >-
      Registers a new patient in the system. Call this ONLY when name_look_up
      returned not found and the caller has provided their full name.
      Always pass the caller's phone number as {caller_number}.
    parameters:
      - name: fullName
        type: string
        description: Full name of the patient as spoken by the caller
        required: true
      - name: phone
        type: string
        description: Caller phone number — always pass {caller_number}
        required: true
    return_raw_json: false
    error_message: I'm sorry, I couldn't register you right now. Please try again.
    body_template: |
      {
        "fullName": "{fullName}",
        "phone": "{phone}",
        "consentDataProcessing": true,
        "consentAiInteraction": true,
        "consentCommunication": true
      }

  fetch_doctor_list:
    kind: in_call_http_lookup
    phase: in_call
    enabled: true
    is_global: false
    timeout_ms: 5000
    url: http://168.144.27.225/api/v1/tools/doctors/list
    method: GET
    headers:
      Content-Type: application/json
      X-Tenant-ID: '1'
      X-API-Key: dev-api-key-replace-in-production
    query_params: {}
    output_variables:
      doctors_list: data.doctors
      doctors_count: data.total
    description: >-
      Fetches the list of available doctors with their specialties.
      Call this ONCE at the start of STATE 2 (doctor selection) to present
      doctor options to the patient. Do NOT call this again after a doctor
      has already been selected in this conversation.
    parameters: []
    return_raw_json: false
    error_message: I'm sorry, I couldn't retrieve the doctor list right now.

  check_doctor_slots:
    kind: in_call_http_lookup
    phase: in_call
    enabled: true
    is_global: false
    timeout_ms: 5000
    url: http://168.144.27.225/api/v1/tools/doctors/{doctor_id}/slots
    method: GET
    headers:
      Content-Type: application/json
      X-Tenant-ID: '1'
      X-API-Key: dev-api-key-replace-in-production
    query_params:
      date: '{appointment_date}'
    output_variables:
      slots_available: data.slots
      slots_count: data.total
      slots_date: data.date
    description: >-
      Checks available appointment slots for a specific doctor on a specific date.
      Call this in STATE 4 immediately after the patient confirms the date.
      Requires doctor_id (from the patient's chosen doctor) and appointment_date
      in YYYY-MM-DD format.
    parameters:
      - name: doctor_id
        type: string
        description: The ID of the doctor chosen by the patient
        required: true
      - name: appointment_date
        type: string
        description: The appointment date in YYYY-MM-DD format
        required: true
    return_raw_json: false
    error_message: I'm sorry, I couldn't check availability right now. Please try another date.

  get_existing_appointments:
    kind: in_call_http_lookup
    phase: in_call
    enabled: true
    is_global: false
    timeout_ms: 5000
    url: http://168.144.27.225/api/v1/tools/appointments/patient
    method: POST
    headers:
      Content-Type: application/json
      X-Tenant-ID: '1'
      X-API-Key: dev-api-key-replace-in-production
    query_params: {}
    output_variables:
      existing_appointments: data.appointments
      existing_count: data.total
    description: >-
      Retrieves existing appointments for the current patient.
      Call this alongside check_doctor_slots in STATE 4 to check for
      scheduling conflicts before presenting slots to the patient.
    parameters:
      - name: patient_id
        type: string
        description: The patient's ID (use the value from name_look_up or register_patient)
        required: true
    return_raw_json: false
    error_message: I'm sorry, I couldn't retrieve your existing appointments right now.
    body_template: |
      {
        "patientId": "{patient_id}"
      }

  book_appointment:
    kind: in_call_http_lookup
    phase: in_call
    enabled: true
    is_global: false
    timeout_ms: 8000
    url: http://168.144.27.225/api/v1/tools/appointments/book
    method: POST
    headers:
      Content-Type: application/json
      X-Tenant-ID: '1'
      X-API-Key: dev-api-key-replace-in-production
    query_params: {}
    success_status_codes: [200, 201]
    output_variables:
      booking_success: success
      appointment_id: data.id
      appointment_time: data.appointmentTime
      appointment_date: data.appointmentDate
      doctor_name_confirmed: data.doctorName
    description: >-
      Books a doctor appointment for the patient. Call this ONLY in STATE 5
      after the patient has explicitly confirmed the date, time, and doctor.
      Requires patient_id, doctor_id, slot_id, and appointment_date.
    parameters:
      - name: patient_id
        type: string
        description: The patient's ID
        required: true
      - name: doctor_id
        type: string
        description: The doctor's ID
        required: true
      - name: slot_id
        type: string
        description: The selected slot ID from check_doctor_slots result
        required: true
      - name: appointment_date
        type: string
        description: The appointment date in YYYY-MM-DD format
        required: true
    return_raw_json: false
    error_message: I'm sorry, I couldn't complete the booking. Please try again.
    body_template: |
      {
        "patientId": "{patient_id}",
        "doctorId": "{doctor_id}",
        "slotId": "{slot_id}",
        "date": "{appointment_date}"
      }

# ─────────────────────────────────────────────
# PRE-CALL TOOLS  (run automatically before greeting)
# ─────────────────────────────────────────────
tools:
  name_look_up:
    kind: generic_http_lookup
    phase: pre_call
    enabled: true
    is_global: false
    timeout_ms: 2000
    url: http://168.144.27.225/api/v1/tools/patients/lookup
    method: POST
    headers:
      Content-Type: application/json
      X-Tenant-ID: '1'
      X-API-Key: dev-api-key-replace-in-production
    query_params: {}
    output_variables:
      lookup_success: success
      patient_name: data.fullName
      patient_id: data.id
      patient_phone: data.phone
      patient_status: data.status
    body_template: '{
      "query": {caller_number}
      }'
